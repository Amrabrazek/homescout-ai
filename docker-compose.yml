name: homescout

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: homescout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-homescout}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-homescout}
      POSTGRES_DB: ${DB_NAME:-homescout}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  typesense:
    image: typesense/typesense:27.1
    container_name: homescout-typesense
    restart: unless-stopped
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-xyz}
      TYPESENSE_ENABLE_CORS: 'true'
    ports:
      - '8108:8108'
    volumes:
      - typesense-data:/data
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8108']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: homescout-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-homescout}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-homescout-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: create the images bucket and make it publicly readable
  minio-init:
    image: minio/mc:latest
    container_name: homescout-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set download local/$${S3_BUCKET}
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-homescout}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-homescout-secret}
      S3_BUCKET: ${S3_BUCKET:-images}

  backend:
    build:
      context: ./backend
    container_name: homescout-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      typesense:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-homescout}
      DB_PASSWORD: ${DB_PASSWORD:-homescout}
      DB_NAME: ${DB_NAME:-homescout}
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-xyz}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/images}
      S3_BUCKET: ${S3_BUCKET:-images}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-homescout}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-homescout-secret}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-local-e5-small}
      EMBEDDING_CACHE_DIR: /models
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SEARCH_LLM_ENABLED: ${SEARCH_LLM_ENABLED:-false}
      SEARCH_LLM_DAILY_LIMIT: ${SEARCH_LLM_DAILY_LIMIT:-500}
      SEARCH_PARSE_CACHE_DAYS: ${SEARCH_PARSE_CACHE_DAYS:-30}
      PLAN_VALUE_ENABLED: ${PLAN_VALUE_ENABLED:-true}
      MARKET_DISCOUNT_RATE: ${MARKET_DISCOUNT_RATE:-0.2}
      WORKER: 'true'
    volumes:
      - model-cache:/models
    ports:
      - '3001:3001'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GRAPHQL_ENDPOINT: http://localhost:3001/graphql
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_USE_TYPESENSE: 'true'
    container_name: homescout-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      GRAPHQL_ENDPOINT: http://backend:3001/graphql
      API_URL: http://backend:3001
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASEURL: ${LANGFUSE_BASEURL:-}
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  typesense-data:
  minio-data:
  model-cache:
